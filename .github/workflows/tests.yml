name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
      - if: matrix.php == '8.4'
        run: composer analyse

  mariadb:
    name: PHP 8.4 / MariaDB
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: database_translations
          MARIADB_USER: database_translations
          MARIADB_PASSWORD: database_translations
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      database.tests.hostname: 127.0.0.1
      database.tests.database: database_translations
      database.tests.username: database_translations
      database.tests.password: database_translations
      database.tests.DBDriver: MySQLi
      database.tests.DBPrefix: test_
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, mysqli
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
